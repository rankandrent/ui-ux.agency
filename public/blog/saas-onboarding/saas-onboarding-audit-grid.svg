<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1358" width="800" height="1358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" role="img" aria-label="SaaS onboarding best practices audit grid with 12 pass or fail items grouped by stage">
<title>SaaS onboarding best practices audit grid with 12 pass or fail items grouped by stage</title>
<rect width="800" height="1358" fill="#FFFFFF"/>
<path d="M52 190 V1334" stroke="#0755E9" stroke-width="3" fill="none"/>
<g class="card">
<rect x="32" y="24" width="736" height="64" rx="16" fill="#1B232E"/>
<text x="80" y="66" font-size="26" font-weight="800" fill="#FFFFFF">Fix the earliest failing stage first</text>
</g>
