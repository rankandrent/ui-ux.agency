<text x="172" y="297" font-size="26" font-weight="400" fill="#1B232E">SSO for B2B accounts</text>
<rect x="636" y="273" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="273" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
</g>
<g class="card">
<rect x="96" y="346" width="672" height="150" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
