<rect x="704" y="875" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<circle cx="140" cy="971" r="21" fill="#E8EEFC"/>
<text x="140" y="980" font-size="26" font-weight="800" fill="#0755E9" text-anchor="middle">8</text>
<text x="172" y="979" font-size="26" font-weight="400" fill="#1B232E">Contextual help on the task</text>
<rect x="636" y="955" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="955" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
</g>
<g class="card">
<rect x="96" y="1028" width="672" height="306" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
