<text x="172" y="819" font-size="26" font-weight="400" fill="#1B232E">Sample data or a template on</text>
<text x="172" y="853" font-size="26" font-weight="400" fill="#1B232E">every empty state</text>
<rect x="636" y="795" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="795" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<circle cx="140" cy="891" r="21" fill="#E8EEFC"/>
