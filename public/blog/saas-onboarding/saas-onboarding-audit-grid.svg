<text x="140" y="1118" font-size="26" font-weight="800" fill="#0755E9" text-anchor="middle">9</text>
<text x="172" y="1117" font-size="26" font-weight="400" fill="#1B232E">Invites asked after first value</text>
<rect x="636" y="1093" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="1093" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<circle cx="140" cy="1161" r="21" fill="#E8EEFC"/>
<text x="140" y="1170" font-size="26" font-weight="800" fill="#0755E9" text-anchor="middle">10</text>
<text x="172" y="1169" font-size="26" font-weight="400" fill="#1B232E">Members skip setup</text>
<rect x="636" y="1145" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="1145" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<circle cx="140" cy="1213" r="21" fill="#E8EEFC"/>
<text x="140" y="1222" font-size="26" font-weight="800" fill="#0755E9" text-anchor="middle">11</text>
<text x="172" y="1221" font-size="26" font-weight="400" fill="#1B232E">Every email deep-links to a step</text>
<rect x="636" y="1197" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="1197" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<circle cx="140" cy="1265" r="21" fill="#E8EEFC"/>
<text x="140" y="1274" font-size="26" font-weight="800" fill="#0755E9" text-anchor="middle">12</text>
<text x="172" y="1273" font-size="26" font-weight="400" fill="#1B232E">Activation rate, time to first value</text>
<text x="172" y="1307" font-size="26" font-weight="400" fill="#1B232E">and day-7 return rate tracked</text>
<rect x="636" y="1249" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
<rect x="704" y="1249" width="32" height="32" rx="6" fill="#FFFFFF" stroke="#1B232E" stroke-width="2"/>
</g>
