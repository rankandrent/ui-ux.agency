<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1072" width="800" height="1072" font-family="'Plus Jakarta Sans', system-ui, sans-serif" role="img" aria-label="SaaS user onboarding compared with customer onboarding, with the handoff screens between them">
<title>SaaS user onboarding compared with customer onboarding, with the handoff screens between them</title>
<rect width="800" height="1072" fill="#FFFFFF"/>
<g class="card">
<rect x="32" y="24" width="356" height="104" rx="16" fill="#0755E9"/>
