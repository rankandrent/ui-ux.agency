</g>
<g class="card">
<rect x="412" y="24" width="356" height="104" rx="16" fill="#1B232E"/>
<text x="590" y="66" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">Customer</text>
<text x="590" y="102" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle">onboarding</text>
</g>
<g class="card">
<rect x="32" y="144" width="356" height="140" rx="16" fill="#F5F8FE" stroke="#E5E7EB" stroke-width="1"/>
<text x="56" y="187" font-size="26" font-weight="400" fill="#6B7281">Owner</text>
<text x="56" y="223" font-size="26" font-weight="700" fill="#1B232E">Product and design</text>
<text x="56" y="257" font-size="26" font-weight="700" fill="#1B232E">team</text>
</g>
<g class="card">
<rect x="32" y="296" width="356" height="140" rx="16" fill="#F5F8FE" stroke="#E5E7EB" stroke-width="1"/>
<text x="56" y="339" font-size="26" font-weight="400" fill="#6B7281">Where</text>
<text x="56" y="375" font-size="26" font-weight="700" fill="#1B232E">Inside the app</text>
</g>
